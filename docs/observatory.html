<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>星風のテラス | TeaMerry Forest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Yomogi&family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/icons/favicon.ico">
    <link rel="stylesheet" href="./css/observatory.css?v=2026.07.19-hokkori-letter">
</head>

<body>

    <main class="observatory" id="observatory">

        <div class="observatory-stage">

            <img
                class="observatory-scene__image observatory-scene__image--day-pc"
                src="./assets/images/observatory/backgrounds/observatory_day_pc_v02.webp"
                alt=""
                aria-hidden="true">

            <img
                class="observatory-scene__image observatory-scene__image--night-pc"
                src="./assets/images/observatory/backgrounds/observatory_night_pc_v02.webp"
                alt=""
                aria-hidden="true">

            <img
                class="observatory-scene__image observatory-scene__image--day-mobile"
                src="./assets/images/observatory/backgrounds/observatory_day_mobile_v03.webp"
                alt=""
                aria-hidden="true">

            <img
                class="observatory-scene__image observatory-scene__image--night-mobile"
                src="./assets/images/observatory/backgrounds/observatory_night_mobile_v02.webp"
                alt=""
                aria-hidden="true">
        <!-- 妖精エリア -->
        <div class="fairy-area">

            <img
                id="fairyImage"
                class="fairy"
                src=""
                alt="妖精">

            <div
                id="fairyBalloon"
                class="fairy-balloon">
            </div>

        </div>

        <div
            id="forestWhisper"
            class="forest-whisper"
            role="status"
            aria-live="polite"
            aria-hidden="true">

            <span class="forest-whisper__label">🌿 森のささやき</span>
            <span id="forestWhisperText" class="forest-whisper__text"></span>

        </div>

        <!-- 昼モード -->
        <section
            id="dayPanel"
            class="day-panel">

            <button
                type="button"
                class="bottle-mail-hotspot"
                id="bottleMailButton"
                aria-label="ボトルメールを書く"></button>

        </section>

        <!-- 夜モード -->
        <section
            id="nightPanel"
            class="night-panel">

            <button
                type="button"
                class="wish-star-hotspot"
                id="wishStarButton"
                aria-label="願いごとを書く"></button>

        </section>

        <button
            type="button"
            class="hokkori-hotspot hokkori-hotspot--day"
            id="hokkoriButton"
            aria-label="今日のほっこりを見る"></button>

        <button
            type="button"
            class="hokkori-hotspot hokkori-hotspot--night"
            id="hokkoriNightButton"
            aria-label="今日のほっこりを見る"></button>

        <div
            id="driftBottleArrival"
            class="drift-bottle-arrival"
            hidden>

            <button
                type="button"
                id="driftBottleButton"
                class="drift-bottle-button"
                aria-label="流れ着いたボトルメールを読む">

                <img
                    src="./assets/images/observatory/bottle_water_landing.png"
                    alt=""
                    class="drift-bottle-image">

            </button>

        </div>

        <div
            id="driftBottleReceive"
            class="observatory-video-overlay observatory-video-overlay--bottle-receive drift-bottle-receive"
            aria-hidden="true"
            hidden>

            <div class="observatory-video-stage">

                <video
                    id="driftBottleReceiveVideo"
                    class="observatory-video-player drift-bottle-receive-video"
                    src="./assets/images/observatory/animations/bottle_receive_v02.webm"
                    playsinline
                    preload="auto"></video>

            </div>

        </div>

        <div
            id="driftBottleModal"
            class="drift-bottle-modal"
            aria-hidden="true"
            hidden>

            <div
                class="drift-bottle-letter-stage"
                role="dialog"
                aria-modal="true"
                aria-labelledby="driftBottleTitle"
                tabindex="-1">

                <p
                    id="driftBottleTitle"
                    class="drift-bottle-title drift-bottle-title--sr">

                    流れ着いたボトルメール

                </p>

                <div class="drift-bottle-letter-paper">

                    <img
                        src="./assets/images/observatory/bottle_mail/paper_letter_v01.png"
                        alt=""
                        class="drift-bottle-letter-paper-image">

                    <div class="drift-bottle-letter-content">

                        <p
                            id="driftBottleSender"
                            class="drift-bottle-sender">

                            おさんぽさんより

                        </p>

                        <p
                            id="driftBottleBody"
                            class="drift-bottle-body"></p>

                    </div>

                    <button
                        type="button"
                        id="driftBottleClose"
                        class="drift-bottle-close">

                        紙をたたむ

                    </button>

                </div>

            </div>

        </div>

        <!-- 森へ戻る -->

        <a
            href="./index.html?from=observatory"
            class="forest-back">

            <img
                src="./assets/images/buttan/forest_go_buttan_1.webp"
                alt="森へ戻る">

        </a>

        <section
            id="bottleWriteView"
            class="observatory-view observatory-view--bottle-write"
            aria-hidden="true">

            <div class="bottle-write-card">

                <button
                    type="button"
                    class="observatory-view__back"
                    data-observatory-back>

                    戻る

                </button>

                <textarea
                    id="bottleMessageInput"
                    class="observatory-view__text bottle-textarea"
                    maxlength="100"
                    aria-label="ボトルメールを書く"></textarea>

                <div
                    id="bottleWriterName"
                    class="bottle-writer-name"></div>

                <div
                    class="observatory-view__counter bottle-counter"
                    data-counter-for="bottleMessageInput">

                    0/100

                </div>

                <div
                    id="bottleLimitMessage"
                    class="bottle-limit-message"
                    aria-live="polite"></div>

                <button
                    type="button"
                    class="bottle-insert-hotspot"
                    aria-label="ボトルに入れる"
                    data-bottle-flush>
                </button>

                <div
                    id="bottlePrivacyModal"
                    class="bottle-privacy-modal"
                    aria-hidden="true">

                    <div
                        class="bottle-privacy-dialog"
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="bottlePrivacyTitle">

                        <p
                            id="bottlePrivacyTitle"
                            class="bottle-privacy-title">

                            選んでください。

                        </p>

                        <button
                            type="button"
                            class="bottle-privacy-choice"
                            data-bottle-public="true">

                            <span>森の掲示板に貼ってもいいよ。</span>
                            <small>今日のほっこりに選ばれることがあります。</small>

                        </button>

                        <button
                            type="button"
                            class="bottle-privacy-choice"
                            data-bottle-public="false">

                            <span>ただの独り言。</span>
                            <small>森にひっそり流します。</small>

                        </button>

                        <button
                            type="button"
                            class="bottle-privacy-cancel"
                            data-bottle-privacy-cancel>

                            やっぱりやめる

                        </button>

                    </div>

                </div>

            </div>

        </section>

        <section
            id="wishWriteView"
            class="observatory-view observatory-view--wish-write"
            aria-hidden="true">

            <div class="wish-write-card">

                <button
                    type="button"
                    class="observatory-view__back"
                    data-observatory-back>

                    戻る

                </button>

                <textarea
                    id="wishMessageInput"
                    class="observatory-view__text wish-textarea"
                    maxlength="60"
                    aria-label="願いごとを書く"></textarea>

                <div
                    id="wishWriterName"
                    class="wish-writer-name"></div>

                <div
                    class="observatory-view__counter wish-counter"
                    data-counter-for="wishMessageInput">

                    0 / 60

                </div>

                <button
                    type="button"
                    class="wish-lantern-hotspot"
                    aria-label="ランタンに入れる"
                    data-wish-lantern>
                </button>

                <div
                    id="wishPrivacyModal"
                    class="wish-privacy-modal"
                    aria-hidden="true">

                    <div
                        class="wish-privacy-dialog"
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="wishPrivacyTitle">

                        <p
                            id="wishPrivacyTitle"
                            class="wish-privacy-title">

                            願い星をどう届けますか？

                        </p>

                        <button
                            type="button"
                            class="wish-privacy-choice"
                            data-wish-public="true">

                            掲示板に表示してもいい。

                        </button>

                        <button
                            type="button"
                            class="wish-privacy-choice"
                            data-wish-public="false">

                            ただ夜空にとばす

                        </button>

                        <button
                            type="button"
                            class="wish-privacy-cancel"
                            data-wish-privacy-cancel>

                            やめる

                        </button>

                    </div>

                </div>


            </div>

        </section>

        <section
            id="wishLanternView"
            class="observatory-view observatory-view--wish-lantern"
            aria-hidden="true">

            <div class="wish-lantern-scene">

                <div class="wish-lantern-character">
                    <img
                        class="wish-lantern-lilu"
                        src="./assets/images/lilu/present/lilu_full_present_normal.webp"
                        alt="ランタンを持つリル">

                    <img
                        class="wish-lantern-item"
                        src="./assets/images/observatory/rantan/lantern_wood_closed.webp"
                        alt="">
                </div>

                <div
                    id="wishLanternMessage"
                    class="wish-lantern-message">

                    木星のランタンが出た。<br>
                    ミントが好きなやつ

                </div>

                <div class="observatory-video-stage wish-lantern-video-stage">

                    <video
                        id="wishLanternVideo"
                        class="observatory-video-player wish-lantern-video"
                        src="./assets/images/observatory/animations/wishing_Star_v01.webm"
                        playsinline
                        preload="auto"></video>

                </div>

            </div>

        </section>

        <section
            id="bottleHokkoriView"
            class="observatory-view observatory-view--bottle-hokkori"
            aria-hidden="true">

            <div class="hokkori-board" aria-live="polite">

                <div class="hokkori-board__letters" id="hokkoriBoardLetters"></div>

                <div
                    class="hokkori-board__empty"
                    id="hokkoriBoardEmpty"
                    hidden>

                    今日の便りは、まだ風の途中にあるみたい。

                </div>

                <div class="hokkori-board__characters" aria-hidden="true"></div>

            </div>

            <button
                type="button"
                class="observatory-view__back"
                data-observatory-back>

                戻る

            </button>

        </section>

        <section
            id="wishHokkoriView"
            class="observatory-view observatory-view--wish-hokkori"
            aria-hidden="true">

            <div class="wish-hokkori-board" aria-live="polite">

                <div class="wish-hokkori__stars" id="wishHokkoriStars"></div>

                <div
                    class="wish-hokkori__characters"
                    id="wishHokkoriCharacters"
                    aria-hidden="true"></div>

            </div>

            <button
                type="button"
                class="observatory-view__back"
                data-observatory-back>

                戻る

            </button>

        </section>

        <section
            id="bottleFlushView"
            class="observatory-view observatory-video-overlay observatory-video-overlay--bottle-send observatory-view--bottle-flush"
            aria-hidden="true">

            <div class="observatory-video-stage">

                <video
                    id="bottleFlushVideo"
                    class="observatory-video-player bottle-flush-video"
                    src="./assets/images/observatory/animations/bottle_flush_v02.mp4"
                    playsinline
                    preload="auto"></video>

            </div>

        </section>

        </div>

    </main>

    <script src="./js/dialogueEngine.js?v=2026.07.18-hotspot-map"></script>
    <script src="./today-hokkori.js?v=2026.07.18-hotspot-map"></script>
    <script src="./observatory.js?v=2026.07.19-hokkori-letter"></script>
    <script src="./js/build-info-badge.js?v=2026.07.18-hotspot-map"></script>

</body>
</html>
