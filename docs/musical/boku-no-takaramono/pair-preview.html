<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぼくの宝物 色づき検証</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #101418; }
    #viewport { width: 100%; height: 100%; overflow: auto; scrollbar-gutter: stable; }
    #content { position: relative; margin: 0 auto; overflow: hidden; }
    #stage { position: absolute; left: 0; top: 0; transform-origin: top left; overflow: hidden; }
    .tb-layer { position: absolute; }
    .tb-layer-image-frame, .tb-layer img, .tb-layer svg { width: 100%; height: 100%; display: block; }
    .tb-layer img { object-fit: fill; pointer-events: none; }
    .tb-image-error { display: none; }
    .has-image-error .tb-image-error { display: block; position: absolute; inset: 0; background: #12191c; color: #fff; }
    .is-test-hit-layer { opacity: 0 !important; cursor: pointer; }
    #error { margin: 16px; color: #fff; font: 14px system-ui; }
  </style>
</head>
<body>
  <p id="error" role="alert" hidden></p>
  <main id="viewport"><div id="content"><div id="stage"></div></div></main>
