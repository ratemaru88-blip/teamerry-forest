<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まろうどのティールーム | TeaMerry Forest</title>
  <link rel="stylesheet" href="./css/tea_room.css">
</head>
<body>
  <main class="tea-room" aria-label="まろうどのティールーム">
    <div class="coffee-steam" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="master-speech" id="masterSpeech" aria-live="polite"></div>

    <section class="tea-notice-board" aria-labelledby="teaNoticeTitle">
      <div class="tea-notice-board__inner">
        <p class="tea-notice-board__brand">Tea Merry Forest</p>
        <h1 class="tea-notice-board__title" id="teaNoticeTitle">森のお知らせ</h1>

        <div
          class="tea-notice-board__grid"
          id="teaNoticeGrid"
          aria-label="森のお知らせ一覧">
        </div>

        <div class="tea-notice-board__memos" aria-hidden="true">
          <div class="tea-notice-memo">今日もお茶が<br>おいしく<br>入りました。</div>
          <div class="tea-notice-memo">森ねこが<br>ソファで<br>お昼寝中…zz</div>
          <div class="tea-notice-memo">今日の木の実<br>のこり3つ</div>
          <div class="tea-notice-memo">葉っぱ<br>募集中です♪</div>
        </div>

        <p class="tea-notice-board__guide">
          <span>NEW 新着のお知らせ</span>
          <span>1〜5 タップで詳細を表示</span>
          <span>メモ風カードは飾りです</span>
        </p>
      </div>
    </section>

    <section class="tea-mobile-notices" aria-labelledby="teaMobileNoticeTitle">
      <div class="tea-mobile-notices__inner">
        <p class="tea-mobile-notices__brand">Tea Merry Forest</p>
        <h1 class="tea-mobile-notices__title" id="teaMobileNoticeTitle">森のお知らせ</h1>
        <div
          class="tea-mobile-notices__list"
          id="teaMobileNoticeList"
          aria-label="森のお知らせ一覧">
        </div>
        <div class="tea-mobile-notices__ribbon">
          今日もお茶がおいしく入りました。
        </div>
        <div class="tea-mobile-notices__dots" aria-hidden="true">
          <span class="is-active"></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </section>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/blog"
      class="bookshelf-link bookshelf-link--blog"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ブログを開く">
      ブログ
    </a>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/contact-8"
      class="bookshelf-link bookshelf-link--contact"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="お問い合わせを開く">
      お問い合わせ
    </a>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/%E6%97%A7kakaoblend"
      class="bookshelf-link bookshelf-link--history"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TeaMerryの歩みを開く">
      TeaMerryの歩み
    </a>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/sm%E3%83%AC%E3%83%83%E3%82%B9%E3%83%B3"
      class="bookshelf-link bookshelf-link--friends"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="友だちの森を開く">
      友だちの森
    </a>

    <a href="./index.html" class="mori-link" aria-label="森へ戻る">
      <img
        src="./assets/images/buttan/forest_go_buttan_1.webp"
        alt="森へ"
        class="mori-button"
      >
    </a>

    <div
      class="tea-notice-modal"
      id="teaNoticeModal"
      aria-hidden="true">
      <div
        class="tea-notice-modal__dialog"
        role="dialog"
        aria-modal="false"
        aria-labelledby="teaNoticeModalTitle">
        <button
          type="button"
          class="tea-notice-modal__close"
          id="teaNoticeModalClose"
          aria-label="お知らせを閉じる">
          ×
        </button>
        <p class="tea-notice-modal__number" id="teaNoticeModalNumber"></p>
        <h2 class="tea-notice-modal__title" id="teaNoticeModalTitle"></h2>
        <img
          class="tea-notice-modal__image"
          id="teaNoticeModalImage"
          src=""
          alt="">
        <p class="tea-notice-modal__body" id="teaNoticeModalBody"></p>
      </div>
    </div>
  </main>

  <script>
    const masterMessages = [
      "今日は\n風が先に\n来ていたよ。",
      "誰かの願いが\n空へ向かった\nみたいだね。",
      "リルがまた\n押し花を\n置いていったよ。",
      "森が少し\n静かだね。",
      "お茶の香りが\nよく広がる日だ。",
      "小さなまろうどが\nさっきまで\n座っていたよ。",
      "何もしない時間も\nここでは\n大切なんだ。",
      "カップがひとつ\n君を待っていたよ。",
    ];

    const masterSpeech = document.getElementById("masterSpeech");
    if (masterSpeech) {
      masterSpeech.textContent =
        masterMessages[Math.floor(Math.random() * masterMessages.length)];
    }
  </script>
  <script src="./tea_room.js?v=20260711-notice-board-root"></script>
</body>
</html>
