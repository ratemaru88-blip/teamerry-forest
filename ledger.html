<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Unforgotten Ledger | 忘れじの記録書</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kurenaido&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="ledger.css" />
</head>
<body>
  <main class="ledger-page" id="ledger-top">
    <section class="ledger-book">
      <img
        class="ledger-bg"
        src="assets/images/cave/ledger_open.webp"
        alt="開かれた忘れじの記録書"
      />

      <div class="ledger-content">
        <div class="ledger-left">
          <p class="ledger-small">The Unforgotten Ledger</p>
          <h1>忘れじの記録書</h1>
          <p class="ledger-subtitle">CONTENTS / 目次</p>
        </div>

        <nav class="ledger-right" aria-label="記録書の目次">
          <a href="https://ratemaru88.wixsite.com/teamerry/about-5-1" class="chapter-card">
            <span class="chapter-number">Ⅰ</span>
            <span>
              <strong>森のまろうど</strong>
              <small>TeaMerryの仲間たち</small>
              <em>飲みものから生まれた小さな妖精たちの記録。</em>
            </span>
          </a>

          <a href="#residents" class="chapter-card" data-ledger-jump="residents">
            <span class="chapter-number">Ⅱ</span>
            <span>
              <strong>森の住民</strong>
              <small>森に暮らす者たち</small>
              <em>森に根づいて暮らす妖精や住人たちの記録。</em>
            </span>
          </a>

          <a href="#tales" class="chapter-card">
            <span class="chapter-number">Ⅲ</span>
            <span>
              <strong>語り継がれしこと</strong>
              <small>過去の出来事と言い伝え</small>
              <em>洞窟、滝、森に残る古い出来事の記録。</em>
            </span>
          </a>
        </nav>
      </div>
    </section>

    <section class="resident-record" id="residents" aria-label="森の住民 記録書">
      <div class="record-button-wrap">
        <nav class="record-nav" aria-label="記録書ページ操作">
          <img
            class="record-button-image"
            src="./assets/images/record/kirokusyo_botun.webp"
            alt=""
          />

          <button
            class="record-nav-hit record-nav-hit--prev"
            type="button"
            aria-label="前ページへ"
            disabled>
          </button>

          <a
            class="record-nav-hit record-nav-hit--close"
            href="#ledger-top"
            aria-label="Close"
            data-ledger-close>
          </a>

          <button
            class="record-nav-hit record-nav-hit--next"
            type="button"
            aria-label="次ページへ"
            disabled>
          </button>
        </nav>
      </div>

      <div class="record-spread ledger-spread" aria-label="Lilu record book pages">
        <div class="record-pages">
          <figure class="record-page ledger-record-page ledger-page-left">
            <img
              src="./assets/images/record/lilu_profile_left.webp"
              alt=""
            />
          </figure>

          <figure class="record-page ledger-record-page ledger-page-right right">
            <img
              src="./assets/images/record/lilu_profile_right.webp"
              alt=""
            />
          </figure>
        </div>
      </div>
    </section>

    <a class="back-link" href="cave.html">書を閉じる</a>
  </main>

</body>
</html>
