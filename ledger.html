<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Unforgotten Ledger | 忘れじの記録書</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #16100b;
      color: #fff1cf;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 72px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    span {
      display: block;
      margin-top: 16px;
      font-size: clamp(20px, 3.5vw, 38px);
    }
  </style>
</head>
<body>
  <main>
    <h1>
      The Unforgotten Ledger
      <span>忘れじの記録書</span>
    </h1>
  </main>
</body>
</html>
