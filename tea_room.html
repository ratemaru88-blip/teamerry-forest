<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まろうどのティールーム | TeaMerry Forest</title>
  <link rel="stylesheet" href="./css/tea_room.css?v=2026.07.17-08">
</head>
<body>
  <main class="tea-room" aria-label="まろうどのティールーム">
    <div class="coffee-steam" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="master-speech" id="masterSpeech" aria-live="polite"></div>

    <section class="tea-notice-board" aria-labelledby="teaNoticeTitle">
      <h1 class="tea-notice-board__heading" id="teaNoticeTitle">森のお知らせ</h1>
      <div class="tea-notice-board__stage">
        <picture class="tea-notice-board__picture">
          <source
            media="(max-width: 768px)"
            srcset="./assets/images/tea_room/notice_board_mobile.webp"
            type="image/webp">
          <source
            srcset="./assets/images/tea_room/notice_board_pc.webp"
            type="image/webp">
          <img
            class="tea-notice-board__image"
            src="./assets/images/tea_room/notice_board_pc.png"
            alt="森のお知らせ掲示板。1から5までのお知らせカードが並んでいます。">
        </picture>
        <div
          class="tea-notice-board__hotspots"
          id="teaNoticeHotspots"
          aria-label="森のお知らせ一覧">
        </div>
      </div>
    </section>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/blog"
      class="bookshelf-link bookshelf-link--blog"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ブログを開く">
      ブログ
    </a>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/contact-8"
      class="bookshelf-link bookshelf-link--contact"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="お問い合わせを開く">
      お問い合わせ
    </a>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/%E6%97%A7kakaoblend"
      class="bookshelf-link bookshelf-link--history"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TeaMerryの歩みを開く">
      TeaMerryの歩み
    </a>

    <a
      href="https://ratemaru88.wixsite.com/teamerry/sm%E3%83%AC%E3%83%83%E3%82%B9%E3%83%B3"
      class="bookshelf-link bookshelf-link--friends"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="友だちの森を開く">
      友だちの森
    </a>

    <a href="./index.html" class="mori-link" aria-label="森へ戻る">
      <img
        src="./assets/images/buttan/forest_go_buttan_1.webp"
        alt="森へ"
        class="mori-button"
      >
    </a>

    <div
      class="tea-notice-modal"
      id="teaNoticeModal"
      aria-hidden="true">
      <div
        class="tea-notice-modal__dialog"
        role="dialog"
        aria-modal="false"
        aria-labelledby="teaNoticeModalTitle">
        <button
          type="button"
          class="tea-notice-modal__close"
          id="teaNoticeModalClose"
          aria-label="お知らせを閉じる">
          ×
        </button>
        <p class="tea-notice-modal__number" id="teaNoticeModalNumber"></p>
        <h2 class="tea-notice-modal__title" id="teaNoticeModalTitle"></h2>
        <img
          class="tea-notice-modal__image"
          id="teaNoticeModalImage"
          src=""
          alt="">
        <p class="tea-notice-modal__body" id="teaNoticeModalBody"></p>
      </div>
    </div>
  </main>

  <script>
    const masterMessages = [
      "今日は\n風が先に\n来ていたよ。",
      "誰かの願いが\n空へ向かった\nみたいだね。",
      "リルがまた\n押し花を\n置いていったよ。",
      "森が少し\n静かだね。",
      "お茶の香りが\nよく広がる日だ。",
      "小さなまろうどが\nさっきまで\n座っていたよ。",
      "何もしない時間も\nここでは\n大切なんだ。",
      "カップがひとつ\n君を待っていたよ。",
    ];

    const masterSpeech = document.getElementById("masterSpeech");
    if (masterSpeech) {
      masterSpeech.textContent =
        masterMessages[Math.floor(Math.random() * masterMessages.length)];
    }
  </script>
  <script src="./tea_room.js?v=2026.07.17-08"></script>
  <script src="./js/build-info-badge.js?v=2026.07.17-08"></script>
</body>
</html>
