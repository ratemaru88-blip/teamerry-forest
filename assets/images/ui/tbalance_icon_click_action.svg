<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .arrow-shape {
        stroke: #1e2025;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #ffffff;
      }
      .ripple {
        stroke: #1e2025;
        stroke-width: 18;
        stroke-linecap: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- 外側・中間・内側の波紋（円弧） -->
  <path class="ripple" d="M 210 50 A 170 170 0 1 0 180 385" />
  <path class="ripple" d="M 210 95 A 125 125 0 1 0 185 342" />
  <path class="ripple" d="M 210 140 A 80 80 0 1 0 190 298" />

  <!-- マウスカーソル（矢印） -->
  <path class="arrow-shape" d="
    M 200 225
    L 425 295
    L 350 345
    L 415 440
    L 365 470
    L 300 375
    L 245 440
    Z
  " />
</svg>
