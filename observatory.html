<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>星風のテラス | TeaMerry Forest</title>

    <link rel="stylesheet" href="./css/observatory.css">
</head>

<body>

    <main class="observatory" id="observatory">

        <!-- 妖精エリア -->
        <div class="fairy-area">

            <img
                id="fairyImage"
                class="fairy"
                src=""
                alt="妖精">

            <div
                id="fairyBalloon"
                class="fairy-balloon">
            </div>

        </div>

        <!-- 昼モード -->
        <section
            id="dayPanel"
            class="day-panel">

            <button
                class="action-button"
                id="bottleMailButton">

                📮 ボトルメールを書く

            </button>

        </section>

        <!-- 夜モード -->
        <section
            id="nightPanel"
            class="night-panel">

            <button
                class="action-button"
                id="wishStarButton">

                ⭐ 願いごとを書く

            </button>

        </section>

        <!-- 森へ戻る -->

        <a
            href="./index.html"
            class="forest-back">

            🌲 森へ戻る

        </a>

    </main>

    <script src="./observatory.js"></script>

</body>
</html>
