<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#32553a">
  <title>森のおみくじ | TeaMerry Forest</title>
  <link rel="icon" href="./assets/images/favicon.ico">
  <link rel="stylesheet" href="./css/omikuji.css?v=2026.10.13-result-01">
</head>
<body>
  <header class="omikuji-header">
    <span class="shrine-name">TeaMerry Forest</span>
  </header>
  <main>
    <h1 class="sr-only">森のおみくじ</h1>
    <section id="drawView" class="draw-scene" aria-label="森のおみくじをひく">
      <div class="tube-scene">
        <img id="peekFairy" class="peek-fairy" alt="" aria-hidden="true" hidden>
        <button id="drawButton" class="draw-control" type="button" disabled aria-label="おみくじを引く">
          <span id="drawLabel" class="draw-label">おみくじを引く</span>
          <img class="tube-image" src="./assets/images/omikuji/tube.png" width="243" height="547" alt="">
        </button>
      </div>
      <p id="drawStatus" class="draw-status" role="status">準備中…</p>
      <button id="retryLoad" class="retry-load" type="button" hidden>読み込み直す</button>
      <a class="entry-return art-button" href="./index.html" aria-label="森へ戻る" title="森へ戻る"><img src="./assets/images/buttan/forest_go_buttan_d1.webp" width="500" height="500" alt="森へ戻る"></a>
    </section>
    <section id="resultView" class="result-view" aria-labelledby="resultTitle" hidden>
      <div class="result-main"><article class="fortune-paper">
        <p class="fortune-eyebrow">森から届いた、今日の一枚</p>
        <h2 id="resultTitle" tabindex="-1"></h2>
        <p id="mainText" class="fortune-body"></p>
        <dl class="fortune-details">
          <div><dt id="loveLabel"></dt><dd id="loveText"></dd></div>
          <div><dt id="moneyLabel"></dt><dd id="moneyText"></dd></div>
          <div class="lucky-item"><dt id="itemLabel"></dt><dd id="itemText"></dd></div>
        </dl>
      </article></div>
      <aside class="result-comment" aria-label="森の仲間のひとこと">
        <div class="comment-bubble"><p id="characterLine"></p></div>
        <img id="resultCharacter" width="160" height="210" alt="森の仲間">
      </aside>
      <nav class="result-actions" aria-label="おみくじの後に">
        <button id="againButton" class="art-button again-art" type="button" aria-label="もう一回ひく" title="もう一回ひく"><img src="./assets/images/buttan/mouikkai.webp" width="2172" height="724" alt="もう一回ひく"></button>
        <div class="result-actions-row">
          <button id="mapButton" class="art-button map-art" type="button" aria-label="案内図を見る" title="案内図を見る" aria-haspopup="dialog" aria-controls="omikujiMap"><img src="./assets/images/buttan/annaizuwomiru.webp" width="2172" height="724" alt="案内図を見る"></button>
          <a class="art-button forest-art" href="./index.html" aria-label="森へ戻る" title="森へ戻る"><img src="./assets/images/buttan/forest_go_buttan_d1.webp" width="500" height="500" alt="森へ戻る"></a>
        </div>
      </nav>
    </section>
  </main>
  <dialog id="omikujiMap" class="omikuji-map" aria-labelledby="omikujiMapTitle">
    <header><h2 id="omikujiMapTitle">森の案内図</h2><button id="closeMap" type="button" title="閉じる" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></header>
    <img class="map-overview" src="./assets/backgrounds/forest-guide-evening.webp" width="960" height="540" alt="夕日の映る湖と川を囲む森の全体地図" loading="lazy">
    <p id="mapStatus" role="status"></p>
    <nav id="mapDestinations" aria-label="森のコーナー"></nav>
  </dialog>
  <script src="./js/omikuji.js?v=2026.10.13-result-01"></script>
</body>
</html>
